<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Currículo – Lucas Cordeiro</title>
        <style>
            body {
                font-family: 'Segoe UI', Arial, sans-serif;
                background-color: #f0f2f5;
                padding: 20px;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
                background: #fff;
                padding: 300px;
                display: flex;
                gap: 20px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                border-radius: 10px;
            }
            .foto img {
                width: 200px;
                border-radius: 8px;
            }
            .dados h1 { margin-top: 0; color: #333; }
            .info { margin-bottom: 15px; line-height: 1.6; }
            .tecnologias ul { list-style-type: square; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="foto">
                <img src="lucas.png" alt="Foto de Lucas Cordeiro">
            </div>

            <div class="dados">
                <h1>Lucas Cordeiro</h1>
                <div class="info">
                    <p><strong>Profissão:</strong> Desenvolvedor Front-end</p>
                    <p><strong>Hobbies:</strong> Quadrinhos, livros, música e cinema</p>
                </div>

                <div class="tecnologias">
                    <h3>Tecnologias favoritas:</h3>
                    <ul>
                        <li>HTML5</li>
                        <li>JavaScript</li>
                        <li>jQuery</li>
                    </ul>
                </div>
            </div>
        </div>
    </body>
</html>
